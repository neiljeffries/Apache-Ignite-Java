ignite {
    # Node name
    nodeName: "node"

    # Network configuration
    network {
        port: 3344
        nodeFinder {
            netClusterNodes: ["127.0.0.1:3344"]
        }
    }

    # Client connector configuration
    clientConnector {
        port: 10800
        idleTimeout: 0
        connectTimeout: 5000
        sendServerExceptionStackTraceToClient: true
    }

    # Storage configuration
    storage {
        defaultRegion {
            path: "work"
            size: 256MB
        }
    }

    # SQL configuration
    sql {
        defaultSchema: PUBLIC
    }

    # Compute configuration
    compute {
        threadPoolSize: 4
    }

    # Metrics configuration
    metrics {
        enabled: true
    }
}